          plan.write_text(p,encoding='utf-8')
          PY

      - name: Validar JavaScript e referências
        shell: bash
        run: |
          set -e
          node --check data/sagas/ciclo-de-jesed/books/dinastia-polar/characters.js
          node --check data/sagas/ciclo-de-jesed/books/dinastia-polar/dynasties.js
          node --check data/sagas/ciclo-de-jesed/books/dinastia-polar/social.js
          node --check app/sagas/ciclo-de-jesed/books/dinastia-polar/app.js
          python - <<'PY'
          from pathlib import Path
          import re
          paths=[
            Path('data/sagas/ciclo-de-jesed/books/dinastia-polar/characters.js'),
            Path('data/sagas/ciclo-de-jesed/books/dinastia-polar/dynasties.js'),
            Path('data/sagas/ciclo-de-jesed/books/dinastia-polar/social.js')
          ]
          joined='\n'.join(p.read_text(encoding='utf-8') for p in paths)
          ids=re.findall(r"id:'([^']+)'",joined)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('IDs duplicados: '+', '.join(dup))
          social=paths[2].read_text(encoding='utf-8')
          chars=set(re.findall(r"id:'(jesed-character-[^']+)'",paths[0].read_text(encoding='utf-8')))
          refs=set(re.findall(r"(?:from|to|id):'(jesed-character-[^']+)'",social))
          missing=sorted(refs-chars)
          if missing: raise SystemExit('Referências de personagem ausentes: '+', '.join(missing))
          html=Path('dinastia-polar.html').read_text(encoding='utf-8')
          if 'dinastia-polar/social.js?v=20260914a' not in html: raise SystemExit('social.js não carregado no HTML')
          if len(re.findall(r"id:'jesed-dynasty-",paths[1].read_text(encoding='utf-8'))) != 10: raise SystemExit('Esperava 10 dinastias')
          print('Validação estrutural OK')
          PY


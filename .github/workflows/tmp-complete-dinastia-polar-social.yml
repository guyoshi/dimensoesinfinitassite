name: Complete Dinastia Polar Social

on:
  push:
    paths:
      - '.github/workflows/tmp-complete-dinastia-polar-social.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar dados sociais, dinastias e personagens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          data=root/'data/sagas/ciclo-de-jesed/books/dinastia-polar'

          social = r'''(() => {
            'use strict';
            const X=window.JESED_POLAR_CONTEXT;if(!X)return;const {C,D,BOOK_ID}=X;
            const relationshipTypes={
              family:'Família',friendship:'Amizade',protection:'Proteção',influence:'Influência',
              conflict:'Conflito',rivalry:'Rivalidade',loyalty:'Lealdade',broken:'Ruptura'
            };
            const relationships=[
              {id:'jesed-dp-rel-elis-kalan',slug:'elis-kalan',from:'jesed-character-elis',to:'jesed-character-kalan',typeKey:'family',type:'Família escolhida',state:'Irmãos de criação · proteção e atrito',description:'Elis e Kalan cresceram na mesma casa coletiva de Maruva e se tratam como irmãos. Kalan assumiu cedo a função prática de protegê-la e manter a casa funcionando; Elis confia nele, mas resiste quando a proteção vira controle.',fromView:'Para Elis, Kalan é abrigo, família e também alguém que ainda insiste em tratá-la como criança.',toView:'Para Kalan, proteger Elis é parte da responsabilidade que assumiu quando os adultos da casa deixaram lacunas.',evolution:['Cap. 2 · rotina familiar em Maruva','Cap. 3 · Kalan investiga a agressão a Orel sem envolver Elis','Cap. 6 · o peso de sustentar a casa se torna explícito'],sources:['Dinastia Polar — Capítulos 2, 3 e 6']},
              {id:'jesed-dp-rel-elis-karesis',slug:'elis-karesis',from:'jesed-character-elis',to:'jesed-character-karesis',typeKey:'family',type:'Tutela e afeto',state:'Vínculo próximo, mas instável',description:'Karesis é o responsável legal da casa coletiva e uma figura de referência para Elis, embora desapareça por dias e deixe responsabilidades sem resposta. Quando retorna no Capítulo 6, é com Elis que escolhe dividir a história dos Meninos do Vento.',fromView:'Elis se irrita com as ausências de Karesis, mas ainda procura nele histórias, atenção e uma forma de pertencimento.',toView:'Karesis evita se explicar, porém demonstra uma intimidade particular com Elis ao preservar histórias e memórias através dela.',evolution:['Caps. 1–3 · presença sentida principalmente pela ausência','Cap. 6 · retorno a Maruva','Cap. 6 · Meninos do Vento'],sources:['Dinastia Polar — Capítulos 1, 2, 3 e 6']},
              {id:'jesed-dp-rel-kalan-karesis',slug:'kalan-karesis',from:'jesed-character-kalan',to:'jesed-character-karesis',typeKey:'conflict',type:'Família e responsabilidade',state:'Ruptura em formação',description:'A ausência frequente de Karesis força Kalan a agir como responsável real pela casa. O retorno dele no Capítulo 6 transforma anos de incômodo em confronto direto: Kalan o acusa de abandonar todos justamente quando dependem de sua presença legal.',fromView:'Kalan vê Karesis como alguém que possui a autoridade formal sem carregar o peso cotidiano que vem com ela.',toView:'Karesis recebe as acusações sem se defender e não explica onde esteve, mantendo a distância que alimenta a raiva de Kalan.',evolution:['Caps. 2–3 · ausência e preocupação','Cap. 6 · retorno ferido e alcoolizado','Cap. 6 · Kalan diz que pode assumir a casa quando completar dezoito ciclos'],sources:['Dinastia Polar — Capítulos 2, 3 e 6']},
              {id:'jesed-dp-rel-elis-orel',slug:'elis-orel',from:'jesed-character-elis',to:'jesed-character-orel',typeKey:'protection',type:'Afeto doméstico',state:'Carinho silencioso',description:'Orel é uma das presenças mais gentis da casa de Maruva. Sua dificuldade de fala não impede uma comunicação afetiva muito clara com Elis, que reconhece seus abraços e gestos como parte da normalidade da casa.',fromView:'Elis entende Orel sem exigir que ele se expresse como os outros e reage com indignação quando ele é ferido.',toView:'Orel procura Elis com afeto direto e, no Capítulo 6, ajuda a alertar Kalan para o retorno de Karesis.',evolution:['Cap. 1 · convivência doméstica','Cap. 2 · agressão a Orel abala a casa','Cap. 6 · Orel continua integrado ao núcleo'],sources:['Dinastia Polar — Capítulos 1, 2 e 6']},
              {id:'jesed-dp-rel-selina-vetarius',slug:'selina-vetarius',from:'jesed-character-selina',to:'jesed-character-vetarius-polar',typeKey:'loyalty',type:'Serviço político',state:'Lealdade crítica',description:'Selina serve à administração de Kaeliran e trabalha diretamente com Vetarius, mas sua lealdade não é obediência cega. Ela percebe riscos institucionais que o soberano minimiza e é enviada para executar decisões das quais discorda.',fromView:'Selina respeita o peso do cargo de Vetarius, mas enxerga a distância crescente entre a segurança que ele projeta e a fragilidade das instituições.',toView:'Vetarius confia na competência de Selina para transformar sua vontade em ação, inclusive ao mandá-la buscar Dareth.',evolution:['Cap. 4 · Selina administra problemas que chegam a Kaendar','Cap. 4 · Vetarius escolhe Dareth sem consultar o Conselho','Cap. 5 · Selina tenta cumprir uma decisão politicamente difícil'],sources:['Dinastia Polar — Capítulos 4 e 5']},
              {id:'jesed-dp-rel-selina-dareth',slug:'selina-dareth',from:'jesed-character-selina',to:'jesed-character-dareth-quatro-dedos',typeKey:'influence',type:'Pressão e memória',state:'Confronto com respeito antigo',description:'Dareth conheceu Selina quando ela ainda era criança, por meio do pai dela em Kaendar. No reencontro, essa memória não suaviza a missão: Selina precisa convencê-lo a voltar, e Dareth percebe imediatamente a tentativa de transformar seu nome em obrigação pública.',fromView:'Selina considera Dareth necessário e usa inteligência, provocação e até crueldade verbal para quebrar a recusa dele.',toView:'Dareth vê Selina como a filha de um velho conhecido e como uma administradora que aprendeu a usar precisamente os instrumentos de poder dos quais ele fugiu.',evolution:['Cap. 5 · reencontro depois de muitos anos','Cap. 5 · recusa de Dareth','Cap. 5 · Selina atinge a ferida da identidade que ele tenta evitar'],sources:['Dinastia Polar — Capítulo 5']},
              {id:'jesed-dp-rel-dareth-vetarius',slug:'dareth-vetarius',from:'jesed-character-dareth-quatro-dedos',to:'jesed-character-vetarius-polar',typeKey:'friendship',type:'Amizade e serviço militar',state:'Afeto antigo atravessado por vinte anos de distância',description:'Dareth e Vetarius foram companheiros de guerra antes de um ser lenda aposentada e o outro soberano. Dareth perdeu um dedo defendendo uma passagem estreita e salvando Vetarius e os feridos que o acompanhavam. Quando retorna a Kaeliran depois de vinte anos, o afeto ainda existe, mas também a dor pelo que cada um perdeu.',fromView:'Dareth ainda reconhece o amigo por trás do soberano, mas rejeita a ideia de que antigas lealdades deem a Vetarius direito sobre sua vida.',toView:'Vetarius recebe Dareth com afeição verdadeira e, ao mesmo tempo, tenta mobilizar essa intimidade para fazê-lo representar os Polar.',evolution:['Passagem de Arven · Dareth salva Vetarius','Vinte anos de afastamento','Cap. 7 · reencontro em Kaendar','Cap. 7 · amizade e coerção política ocupam a mesma conversa'],sources:['Dinastia Polar — Capítulos 5 e 7; documento canônico de personagens']},
              {id:'jesed-dp-rel-vetarius-caeren',slug:'vetarius-caeren',from:'jesed-character-vetarius-polar',to:'jesed-character-caeren-polar',typeKey:'family',type:'Pai e filho',state:'Única família imediata restante de Vetarius',description:'Caeren é filho de Vetarius e da falecida Elena. Depois da morte dela, há cinco anos, Vetarius afirma ter ficado sozinho com o garoto. O soberano o descreve como forte e inteligente, mas difícil de conduzir para a política.',fromView:'Vetarius demonstra orgulho pelo filho e tende a minimizar comportamentos que Selina considera preocupantes.',toView:'O ponto de vista de Caeren sobre o pai ainda não foi mostrado diretamente no manuscrito.',evolution:['Antes do livro · nascimento de Caeren','Cinco anos antes do Cap. 7 · morte de Elena','Cap. 4 · Selina observa Vetarius relativizar a crueldade do filho','Cap. 7 · Vetarius fala de Caeren a Dareth'],sources:['Dinastia Polar — Capítulos 4 e 7']},
              {id:'jesed-dp-rel-sumo-vigia-alveris',slug:'sumo-vigia-alveris',from:'jesed-character-sumo-vigia',to:'jesed-character-alveris-polar',typeKey:'rivalry',type:'Disputa institucional',state:'Religião e capital privado testam seus limites',description:'O Culto da Raiz Eterna e a Companhia da Balança Azul cresceram até se tornarem dois centros de poder capazes de disputar influência sem declarar guerra aberta. O choque aparece quando o Sumo Vigia lembra a Alveris que doação não é autoridade.',fromView:'O Sumo Vigia percebe a filantropia e os contratos da Companhia como tentativa de comprar influência sobre uma autoridade que o Culto considera sua.',toView:'Alveris trata dinheiro, logística e estabilidade como argumentos legítimos para participar de decisões antes reservadas ao governo e à religião.',evolution:['Cap. 3 · Companhia e Filhos da Raiz se aproximam','Cap. 4 · confronto no corredor da Casa dos Estandartes','Cap. 4 · “Doação não é autoridade” torna a disputa explícita'],sources:['Dinastia Polar — Capítulos 3 e 4; Kaeliran e Sociedade Polar']}
            ];
            const families=[
              {id:'jesed-dp-family-maruva',slug:'casa-coletiva-maruva',name:'Casa coletiva de Maruva',image:'',subtitle:'Família escolhida · Cidade Exterior',summary:'Mais do que um endereço compartilhado, a casa de Maruva funciona como uma família formada por pessoas que dependem umas das outras para trabalho, água, proteção e reconhecimento legal. Karesis responde formalmente pelo grupo; na prática, Kalan assume parte crescente desse peso.',members:[{id:'jesed-character-karesis',role:'responsável legal'},{id:'jesed-character-elis',role:'moradora · 13 ciclos'},{id:'jesed-character-kalan',role:'irmão de criação de Elis · 17 ciclos'},{id:'jesed-character-tair',role:'morador · 19 ciclos'},{id:'jesed-character-orel',role:'morador'}],details:['Karesis é o responsável registrado perante as instituições, e suas ausências ameaçam permissões e obrigações de todos.','Kalan funciona como responsável cotidiano quando Karesis desaparece, mesmo ainda não tendo idade para assumir formalmente a casa.','Elis e Kalan se tratam como irmãos; Tair participou da alfabetização dos dois; Orel integra o núcleo por afeto e convivência.','A agressão a Orel e a investigação de Kalan transformam a casa num ponto onde desigualdade Nular, burocracia e política começam a se tocar.'],sources:['Dinastia Polar — Capítulos 1, 2, 3 e 6']},
              {id:'jesed-dp-family-vetarius',slug:'casa-soberana-vetarius',name:'Casa soberana de Vetarius',image:'',subtitle:'Família imediata do soberano',summary:'No presente do livro, a família doméstica de Vetarius foi reduzida pela perda. Elena morreu cinco anos antes do reencontro com Dareth, deixando Vetarius e o filho Caeren como núcleo imediato dentro de Kaendar.',members:[{id:'jesed-character-vetarius-polar',role:'soberano'},{name:'Elena',role:'companheira falecida de Vetarius'},{id:'jesed-character-caeren-polar',role:'filho de Vetarius e Elena · 15 ciclos'}],details:['Elena morreu depois de adoecer durante uma estação fria, segundo Vetarius no Capítulo 7.','Vetarius diz ter ficado sozinho com Caeren desde a morte dela.','Caeren já tem quinze ciclos no presente e é observado por Selina como um jovem cuja crueldade o pai tende a minimizar.','A família pertence ao centro de uma linhagem soberana cuja legitimidade é sustentada por sangue, registro e memória institucional.'],sources:['Dinastia Polar — Capítulos 4 e 7; Dinastia Polar — documento oficial']},
              {id:'jesed-dp-family-dareth',slug:'casa-vazia-dareth',name:'A casa vazia de Dareth',image:'',subtitle:'Família perdida · propriedade a oeste de Kaeliran',summary:'A composição exata da família que viveu com Dareth ainda não foi revelada no manuscrito, mas a ausência é material: a propriedade conserva objetos, espaços e hábitos deixados por pessoas que ele tentou proteger afastando-se de Kaeliran.',members:[{id:'jesed-character-dareth-quatro-dedos',role:'único membro nomeado até o Capítulo 7'},{name:'Familiares de Dareth',role:'nomes e vínculos ainda não revelados'}],details:['Uma cerca permanece pintada apenas pela metade.','Pedras arrumadas por uma criança, uma corda numa árvore e uma pequena porta que Dareth evita funcionam como vestígios de vida familiar.','No Capítulo 7, Vetarius conhece a perda e oferece condolências, confirmando que a ausência não é simples separação.','O site preserva a composição familiar em aberto até que o manuscrito revele nomes e relações.'],sources:['Dinastia Polar — Capítulos 5 e 7']}
            ];
            const organisations=[
              {id:'jesed-dp-org-balanca-azul',slug:'companhia-balanca-azul',name:'Companhia da Balança Azul',type:'Companhia mercantil e logística',image:'',summary:'Instituição privada que cresceu ao estabilizar cargas, preços, depósitos e transporte. Para trabalhadores e clientes é uma máquina eficiente; para as elites de Kaeliran, tornou-se um terceiro polo de poder entre soberania e Culto.',function:'Controlar e coordenar contratos, armazéns, documentos, dívidas, carregadores, preços e rotas de transporte.',activity:'Opera em Talarim e por toda Kaeliran, amplia turnos com a preparação do Torneio Decenal e usa doações e contratos para conquistar influência institucional.',themes:['trabalho','logística','capital privado','influência política'],members:[{id:'jesed-character-alveris-polar',role:'proprietário e principal financiador'},{id:'jesed-character-kalan',role:'carregador'},{name:'Cairon',role:'encarregado de trabalho de Kalan'}],sources:['Dinastia Polar — Capítulos 3, 4 e 6; Kaeliran e Sociedade Polar']},
              {id:'jesed-dp-org-culto-raiz',slug:'culto-raiz-eterna',name:'Culto da Raiz Eterna',type:'Instituição religiosa, social e judicial',image:'',summary:'Religião dominante de Kaeliran e uma das grandes estruturas de autoridade da Dinastia. O Culto oferece cuidado, registro e assistência reais, mas também concentra instrumentos de vigilância, julgamento e disciplina social.',function:'Preservar a doutrina da Raiz, conduzir ritos, validar registros familiares, administrar parte da assistência e exercer autoridade espiritual e judicial.',activity:'Mantém o Santuário da Raiz Eterna, Casas da Permanência e agentes capazes de inspecionar, deter e aplicar sanções sob justificativas religiosas ou de segurança.',themes:['fé','permanência','controle social','assistência'],members:[{id:'jesed-character-sumo-vigia',role:'autoridade máxima'},{id:'jesed-character-vesna-da-permanencia',role:'curadora ligada a uma Casa da Permanência'}],sources:['Dinastia Polar — Capítulos 1, 2 e 4; Dinastia Polar — documento oficial; Kaeliran e Sociedade Polar']},
              {id:'jesed-dp-org-filhos-raiz',slug:'filhos-da-raiz',name:'Filhos da Raiz',type:'Braço de vigilância e coerção religiosa',image:'',summary:'Agentes subordinados à ordem religiosa que aparecem no cotidiano como escolta, inspeção, custódia e ameaça de punição. No caso de Elis, reincidências por entrada não autorizada quase transformam a disciplina institucional em mutilação.',function:'Executar inspeções, proteção institucional, custódia, sanções e ordens ligadas à autoridade religiosa.',activity:'Circulam em eventos públicos e operações de fiscalização; sua presença pode significar segurança, assistência ou coerção, dependendo do contexto.',themes:['autoridade','vigilância','punição','ordem'],members:[{id:'jesed-character-sumo-vigia',role:'autoridade superior do Culto'}],sources:['Dinastia Polar — Capítulos 1 e 3; Povos e Facções']},
              {id:'jesed-dp-org-casas-permanencia',slug:'casas-da-permanencia',name:'Casas da Permanência',type:'Rede religiosa e comunitária',image:'',summary:'Cada distrito de Kaeliran possui uma Casa da Permanência. Elas funcionam como pontos de fé, registro, assistência, educação e cuidado, fazendo do Culto uma presença cotidiana muito antes de qualquer tribunal entrar em cena.',function:'Registrar pessoas e vínculos, oferecer serviços religiosos, cuidados e assistência comunitária e manter presença institucional nos distritos.',activity:'Em Maruva, Vesna atende feridos; Sovar e Lia aparecem ligados à rotina de registros consultada por Kalan.',themes:['registro','cuidado','comunidade','vigilância'],members:[{id:'jesed-character-vesna-da-permanencia',role:'curadora em Maruva'},{name:'Sovar Polar',role:'funcionário da Casa da Permanência'},{name:'Lia',role:'funcionária ligada aos registros'}],sources:['Dinastia Polar — Capítulos 1, 2 e 3; Kaeliran e Sociedade Polar']},
              {id:'jesed-dp-org-camara-onze',slug:'camara-dos-onze',name:'Câmara dos Onze',type:'Órgão político e administrativo',image:'',summary:'Órgão permanente que divide parte da administração de Kaeliran com o soberano. Sua existência limita a ideia de poder absolutamente solitário, embora Vetarius demonstre impaciência com o colegiado e seja capaz de contorná-lo em decisões importantes.',function:'Representar cadeiras administrativas, linhagens e o Culto na gestão, registro e deliberação de assuntos de Estado.',activity:'Acompanha governo, leis, recursos e decisões institucionais; no Capítulo 4, Vetarius escolhe o campeão Polar sem consultar o Conselho.',themes:['governo','burocracia','limites do soberano','linhagem'],members:[],sources:['Dinastia Polar — Capítulo 4; Dinastia Polar — documento oficial; Kaeliran e Sociedade Polar']},
              {id:'jesed-dp-org-kaes-calandrir',slug:'kaes-calandrir',name:'Kaes e Calandrir',type:'Estrutura militar da soberania',image:'',summary:'Os Kaes formam a elite militar ligada à proteção e ao comando de Kaeliran. O Calandrir é a autoridade da guarda soberana; Dareth ocupou esse posto no passado e seu nome continua sendo reconhecido décadas depois.',function:'Proteger a soberania, comandar forças de elite e responder por operações militares de alto risco.',activity:'No presente, Amaric é Primeiro Kae. Dareth retorna a Kaeliran como antigo Segundo Kae e ex-Calandrir, carregando uma reputação que a cidade transformou em lenda.',themes:['guerra','lealdade','memória militar','soberania'],members:[{id:'jesed-character-dareth-quatro-dedos',role:'ex-Segundo Kae e ex-Calandrir'},{name:'Amaric',role:'Primeiro Kae no Capítulo 7'}],sources:['Dinastia Polar — Capítulo 7; documento canônico de personagens']}
            ];
            D.relationshipTypes=relationshipTypes;
            D.relationships=relationships;
            D.families=families;
            D.organisations=organisations;
            C.setCollection(BOOK_ID,'relationships',relationships);
            C.setCollection(BOOK_ID,'families',families);
            C.setCollection(BOOK_ID,'organisations',organisations);
          })();
          '''
          (data/'social.js').write_text(social,encoding='utf-8')

          dynasties = r'''(() => {
            'use strict';
            const X=window.JESED_POLAR_CONTEXT;if(!X)return;const {C,D,BOOK_ID}=X;
            const dynasties=[
              {id:'jesed-dynasty-polar',slug:'polar',name:'Dinastia Polar',essence:'Permanência transformada em hegemonia',summary:'A mais antiga e prestigiosa das dez dinastias no presente do livro. Governa Kaeliran, a maior metrópole conhecida de Jesed, combinando força militar, dravenito, burocracia, religião, rotas e uma memória histórica cuidadosamente organizada.',profile:{capital:'Kaeliran',authority:'Vetarius Polar',representative:'Dareth Quatro-Dedos',symbol:'A Raiz',colors:'Azul, metais escuros e dravenito',religion:'Culto da Raiz Eterna · Livro da Permanência',government:'Soberania hereditária apoiada pela Câmara dos Onze, administrações distritais, estruturas militares e uma autoridade religiosa paralela. O soberano não ocupa uma das onze cadeiras.',origin:'A memória pública começa em Kaendar e preserva Orionus, Kaelina e Alyra entre as figuras fundadoras. A origem muito mais antiga ligada a Etérea e aos eterís foi completamente apagada da memória Polar.',territory:'Kaeliran é o coração político, econômico e simbólico. A cidade organiza-se em Cidade Interna, Intermediária e Exterior, com onze distritos; Kaendar permanece fora da divisão urbana comum.',economy:'Salinas, dravenito, armas, tributos, mercados, rotas e uma burocracia capaz de transformar registro em poder. A Companhia da Balança Azul cresceu dentro desse ecossistema.',culture:'Ser Polar depende de sangue reconhecido e registros de linhagem. A Raiz, a permanência e a ideia de continuidade sustentam orgulho coletivo e a crença popular numa origem sagrada.',socialStructure:'Polar, Nular e Sem-Raiz são condições distintas. Estrangeiros podem nascer em Kaeliran por gerações e continuar Nular; um Polar expulso torna-se Sem-Raiz sem deixar de ter origem Polar.',contradiction:'Kaeliran oferece segurança, trabalho, abastecimento e ordem a milhares de pessoas, mas sustenta parte dessa estabilidade por segregação, desigualdade e repressão institucional.',tournament:'Vetarius cria o Primeiro Torneio Decenal e escolhe Dareth como representante Polar.'},themes:['hegemonia','permanência','segregação','memória'],sources:['Dinastia Polar — documento oficial','Kaeliran e Sociedade Polar','Dinastia Polar — Capítulos 1, 4, 5 e 7']},
              {id:'jesed-dynasty-buldar',slug:'buldar',name:'Dinastia Buldar',essence:'Quem controla o alimento controla o tempo',summary:'Maior potência agrícola contínua de Jesed. Os Buldar transformaram famílias de terra, celeiros e canais numa estrutura capaz de alimentar cidades inteiras e sustentar guerras longas.',profile:{capital:'Nyn-Harad',authority:'Saelira da Terra de Dorran',representative:'Khalir Buldar, da Terra de Ardel',symbol:'Nove sementes dentro de um sulco circular',colors:'Vermelho-terra, castanho escuro e amarelo de grão seco',government:'A Mão das Terras governa com o Círculo das Terras, conselho de quinze assentos no qual as nove Famílias Centrais têm peso decisivo.',origin:'As antigas Famílias de Terra cresceram de unidades extensas de sangue para comunidades territoriais. Depois da Guerra das Três Vertentes, os Buldar formalizaram a terceira Dinastia de Jesed.',territory:'Controlam a maior faixa agrícola contínua, articulada por campos, canais, celeiros, cidades e reservas como Maldrin-Alta.',economy:'Grão, sementes, armazenamento, canais, animais de carga, transporte e logística. A verdadeira fortaleza Buldar é a capacidade de produzir, guardar e negar alimento.',culture:'Continuidade, trabalho, provisão, responsabilidade familiar e paciência são virtudes centrais. O rito da Semente Rubra marca a maioridade.',socialStructure:'Nove Famílias Centrais, Famílias Reconhecidas, Famílias Menores e povos submetidos coexistem sob a Dinastia. Nem todo súdito é Buldar.',contradiction:'Alimentam Jesed e, ao mesmo tempo, podem transformar necessidade, terra e dívida em instrumentos de domínio.',tournament:'Khalir Buldar, homem da Terra de Ardel e Ceifador, representa a Dinastia.'},themes:['alimento','terra','dívida','continuidade'],sources:['Dinastia Buldar — documento oficial']},
              {id:'jesed-dynasty-cendar',slug:'cendar',name:'Dinastia Cendar',essence:'Esperar, manter e controlar a passagem',summary:'Uma rede de cidades, postos, oficinas e caminhos que domina a arte de fazer pessoas e recursos atravessarem alturas, rios, pântanos e fronteiras difíceis.',profile:{capital:'Cendar-Vel',authority:'Mavira da Casa Vel',representative:'Serka Cendar, de Thiorin',symbol:'Emblema Cendar preservado desde Guerras de Sangue',government:'A Primeira Guardiã das Passagens governa com a Mesa dos Marcos, de doze assentos, e uma rede descentralizada de Mesas de Passagem.',origin:'Os Cendar nasceram em torno de Cendar-Vel e dos Dois Pilares. A necessidade de defender e manter passagens transformou famílias e oficinas numa rede política.',territory:'Não dependem de uma única metrópole: cidades, postos, pântanos, plataformas, oficinas e gargalos estratégicos formam a Dinastia.',economy:'Mecanismos, pontes, guindastes, drenagem, passagem de cargas, manutenção e conhecimento técnico aplicado ao terreno.',culture:'Prudência, utilidade, responsabilidade, manutenção e memória. Uma estrutura só merece confiança quando alguém sabe mantê-la.',socialStructure:'Seis Casas históricas — Vel, Mairen, Orven, Surran, Lendros e Vardel — convivem com oficinas, postos e comunidades incorporadas.',contradiction:'Prudência pode virar paralisia; utilidade pode reduzir pessoas a peças; manutenção pode se tornar desculpa para impedir mudança.',tournament:'Serka Cendar, de Thiorin, é a representante no Primeiro Torneio Decenal.'},themes:['passagem','engenho','prudência','manutenção'],sources:['Dinastia Cendar — documento oficial']},
              {id:'jesed-dynasty-vendrar',slug:'vendrar',name:'Dinastia Vendrar',essence:'Nós vendemos escolhas. O preço vem depois.',summary:'Potência de ofícios, metal e comércio centrada em Varkhama. Quase todas as dinastias dependem de ferramentas, peças ou armamentos Vendrar, o que torna seus contratos tão políticos quanto suas tropas.',profile:{capital:'Varkhama',authority:'Maerys Vendrar, da Família Narel',representative:'Orven Vendrar, da Família Arven',government:'Uma soberana escolhida e limitada pelo Conselho de Varkhama, de onze assentos. O cargo atual substituiu um longo período de governo colegiado.',origin:'Famílias mercantis, artesãos, mineiros e condutores de carga cresceram ao redor de Varkhama. A Guerra das Três Vertentes acelerou a formalização da Dinastia.',territory:'Varkhama, a Espinha de Varkhama, os Campos Frios, florestas, minas e rotas comerciais compõem um território descontínuo, unido por produção e transporte.',economy:'Ferramentas, armas, peças, combustíveis, equipamentos e manutenção. Os Vendrar também preservam a rara tradição de manejo regular dos varkhires para reconhecimento e travessias difíceis.',culture:'Independência, domínio de ofício e força dos contratos. O Primeiro Compromisso marca a maioridade e a responsabilidade profissional.',socialStructure:'Sete Famílias Maiores — Saren, Narel, Arven, Delvar, Meyron, Odrin e Vessar — dividem influência com famílias menores, oficinas e comerciantes independentes.',contradiction:'A cultura do contrato permite alegar que a responsabilidade termina na venda, mesmo quando o vendedor entende perfeitamente o que sua mercadoria permitirá fazer.',tournament:'Orven Vendrar, da Família Arven, representa a Dinastia.'},themes:['ofício','contratos','armas','responsabilidade'],sources:['Dinastia Vendrar — documento oficial','Povos e Facções']},
              {id:'jesed-dynasty-quendrar',slug:'quendrar',name:'Dinastia Quendrar',essence:'Ninguém recebe de outro o direito de continuar existindo',summary:'Descendentes do quarto clã sobrevivente da Guerra dos Quinze Estandartes, os Quendrar recusaram ser absorvidos pelos povos que formariam os Mardrar e transformaram a fuga em identidade política.',profile:{capital:'Harquen',authority:'Condutora Yamara Quendrar',representative:'Karev Quendrar',religion:'Omu · Palavras de Omu · Anfitriões de Omu',government:'A Condutora lidera, mas decisões permanentes dependem da Assembleia das Casas. O título nasceu na grande fuga e conserva a ideia de conduzir pessoas, não possuí-las.',origin:'Clã pastoral do nordeste, um dos quatro sobreviventes da Guerra dos Quinze Estandartes. Recusou a fusão dos demais sobreviventes, foi atacado e fugiu para o sul.',territory:'Harquen sobe por encostas muradas e se liga a campos de criação, montanhas, passagens e à vasta Floresta de Mirval.',economy:'Criação animal, carne, leite, gordura, couro, reprodução, transporte, conservação, campos e mercados.',culture:'Autonomia, preservação do nome e responsabilidade. A fé em Omu acompanha uma visão de que existir não depende do reconhecimento de outra potência.',socialStructure:'Casas e comunidades podem incorporar indivíduos estrangeiros, mas resistem a grupos externos que tentem preservar autoridade política própria dentro do território.',contradiction:'Um povo que sobreviveu à tentativa de absorção também ocupou, mais tarde, territórios de povos desaparecidos e corre o risco de transformar necessidade em justificativa moral.',tournament:'Karev Quendrar, fundeiro, protetor de comunidades e companheiro de Yamara, representa a Dinastia.'},themes:['autonomia','identidade','fé','sobrevivência'],sources:['Dinastia Quendrar — documento oficial']},
              {id:'jesed-dynasty-braidar',slug:'braidar',name:'Dinastia Braidar',essence:'O que serve deve circular',summary:'Povo do noroeste que transformou antigas oficinas móveis em cidades, depósitos e uma das maiores redes de produção cotidiana de Jesed.',profile:{capital:'Braivar',authority:'Primeira Provedora Averna Braidar',representative:'Barek Braidar',religion:'A Caminhante e as Sete Luzes',government:'Soberania hereditária reconhecida pela Mesa das Oficinas. A Mesa fiscaliza, administra e pode bloquear um sucessor incapaz sem transformar o regime numa eleição comum.',origin:'Povo migrante de origem antiga compartilhada com os Luzdar. A separação ocorreu quando parte decidiu permanecer para estudar uma doença e parte continuou circulando para não concentrar toda a sobrevivência num único lugar.',territory:'Braivar, Seykar, Valenor, Campos de Ardren e grandes rotas do noroeste articulam oficinas, mercados e depósitos.',economy:'Papel, recipientes, ferramentas, carroças, peças, móveis desmontáveis, registros, armazenagem, transporte e manufatura em grande escala.',culture:'A força Braidar não está em produzir sempre a melhor peça, mas em simplificar, padronizar, reparar e fazer objetos úteis chegarem a muita gente.',socialStructure:'A Oficina é unidade social central e pode reunir parentes, aprendizes, trabalhadores, comerciantes, cuidadores e estrangeiros incorporados.',contradiction:'A crença na circulação de coisas úteis pode tornar difícil perceber quando passagem, comércio e produção se transformam em invasão ou exploração.',tournament:'Barek Braidar, veterano da guerra Leidar e combatente de ruptura, representa a Dinastia.'},themes:['circulação','ofício','produção','logística'],sources:['Dinastia Braidar — documento oficial']},
              {id:'jesed-dynasty-grastar',slug:'grastar',name:'Dinastia Grastar',essence:'O que conhece o próprio peso não cai',summary:'Dinastia conservadora do grande planalto ocidental. Redes, cordas, tecidos e estruturas revelam uma cultura obcecada por sustentação, preparação e pela ideia de que nada permanece sozinho.',profile:{capital:'Avarrast',authority:'Detarius Grastar',representative:'Tavena Grastar, de Nhal',government:'Soberania hereditária na qual o governante escolhe livremente um descendente. O Conselho é formado por familiares próximos do soberano e não possui poder comum de veto sobre a sucessão.',origin:'Os Grastar vieram de regiões ainda mais ocidentais e avançaram para o planalto durante gerações. O título de Dinastia consolidou uma soberania que já existia antes do reconhecimento das potências centrais.',territory:'Avarrast domina o planalto; Nhal concentra tecelagens e cordas; Vessar guarda cisternas e rotas próximas ao Deserto de Veshkar.',economy:'Fibras, tecidos, cordas, redes, tendas, estruturas desmontáveis, pedra-véu e serviços de montagem.',culture:'Preparação, estabilidade e distribuição correta de peso. “Nada permanece sozinho” é um provérbio recorrente.',socialStructure:'Pertencimento é rigidamente hereditário. Trabalho, residência, riqueza, adoção ou casamento com estrangeiros não transformam alguém em Grastar.',contradiction:'A busca por estabilidade pode virar fechamento: o povo reconhece que toda estrutura depende de apoios enquanto trata a presença estrangeira como ameaça.',tournament:'Tavena Grastar, de Nhal, representa a Dinastia.'},themes:['estabilidade','isolamento','estrutura','tradição'],sources:['Dinastia Grastar — documento oficial']},
              {id:'jesed-dynasty-leidar',slug:'leidar',name:'Dinastia Leidar',essence:'O limite permite que a vida continue',summary:'A mais antiga potência da margem norte organiza florestas, rios, lagos e criação em torno da ideia de que recursos só permanecem vivos quando alguém aceita limites.',profile:{capital:'Aelvar',authority:'Jovar Leidar',representative:'Talira Leidar',religion:'Sete Pais · três pais e quatro mães de formas animais',government:'Soberania hereditária reconhecida pelo Conselho das Terras, que representa cidades, comunidades, portos, pescadores, criadores, Casas Territoriais e guardas.',origin:'Os primeiros Leidar sobreviveram no extremo norte quando outras comunidades desapareceram, migraram ou foram incorporadas. Aelar Leidar é lembrado como fundador histórico.',territory:'Florestas frias, lagos, nascentes, quedas-d’água, pomares, criação e cursos superiores do Rio Grande formam um território de recursos vivos cuidadosamente administrados.',economy:'Peixe, carne, couro, gordura, frutas, bebidas, madeira, resinas, embarcações, criação, conservação e comércio fluvial.',culture:'Pensar em longo prazo, respeitar temporadas e entender uso como responsabilidade. Estrangeiros podem ser incorporados depois de um ciclo de convivência e trabalho.',socialStructure:'Casas Territoriais reúnem parentes, trabalhadores, adotados e estrangeiros incorporados e recebem direitos de uso sobre recursos que não são tratados como propriedade absoluta.',contradiction:'A responsabilidade sobre recursos pode se converter em pretensão de decidir quem tem direito de atravessar, colher ou permanecer.',tournament:'Talira Leidar, guarda de rios e veterana da guerra Braidar, representa a Dinastia.'},themes:['limite','recursos','território','longo prazo'],sources:['Dinastia Leidar — documento oficial']},
              {id:'jesed-dynasty-luzdar',slug:'luzdar',name:'Dinastia Luzdar',essence:'Todo corpo responde',summary:'Sociedade conhecida por curadores, estudiosos e especialistas em substâncias, mas cuja verdadeira força está em observar reações, registrar processos e transformar conhecimento em responsabilidade pública.',profile:{capital:'Luzhara',authority:'Nesara, Nael, Seran e Mariel Luzdar',representative:'Saren Luzdar, de Seylara',religion:'A Caminhante e as sete estrelas',government:'Quatro soberanos possuem igual autoridade formal, acompanhados por um Conselho composto pelos especialistas mais reconhecidos de diferentes áreas.',origin:'Compartilham uma raiz migrante antiga com Braidar e, mais remotamente, Leidar. Permaneceram nos vales durante uma doença prolongada para estudar água, plantas, contaminação e isolamento.',territory:'Luzhara e vales de transição entre áreas secas e pantanosas concentram jardins, rios, Casas de tratamento e comunidades de estudo.',economy:'Medicamentos, antídotos, substâncias, especiarias, perfumes, conservação, formação e serviços de tratamento.',culture:'Observação, educação, comparação de evidências e a convicção de que corpos e comunidades mostram sinais antes de colapsar.',socialStructure:'Casas podem reunir curadores, professores, agricultores, coletores, comerciantes e estrangeiros incorporados. Educação básica é muito mais extensa que a média de Jesed.',contradiction:'Conhecimento pode ser confundido com direito de decidir pelos outros, justificando segredo, isolamento ou tratamento imposto em nome da proteção.',tournament:'Saren Luzdar, de Seylara, representa a Dinastia; os Luzdar também ocupam papel médico e de inspeção de substâncias no torneio.'},themes:['conhecimento','corpo','medicina','ética'],sources:['Dinastia Luzdar — documento oficial']},
              {id:'jesed-dynasty-mardrar',slug:'mardrar',name:'Dinastia Mardrar',essence:'Possuir partes do futuro alheio',summary:'Uma das potências mais influentes de Jesed, não porque tenha o maior exército, mas porque aprendeu a converter reservas, moeda, crédito e garantias em dependência política.',profile:{capital:'Mari-Aren',authority:'Família Mardrar · Nareva Mardrar como Primeira da Mesa',representative:'Rhevara Mardrar',religion:'Omu · Palavras de Omu',government:'A Mesa da Linhagem possui nove assentos da família governante unificada. A Primeira da Mesa representa publicamente a decisão coletiva, mas não equivale a uma soberana Polar.',origin:'Três dos quatro clãs sobreviventes da Guerra dos Quinze Estandartes fundiram reservas, comando e linhagens. O quarto, Quendrar, recusou a absorção e foi atacado antes de fugir para o sul.',territory:'Mari-Aren, Sul-Merul, Mina de Kelma, Colina dos Veios, Passo de Quia-Mal e Kelvar articulam mineração, reservas e rotas de garantia.',economy:'Meral, minas, crédito, reservas e Casas de Garantia. Financiam colheitas, fortalezas, caravanas e guerras antes de elas existirem plenamente.',culture:'Pertencer significa também ter alguém disposto a responder por sua palavra. Estrangeiros podem entrar pela combinação de residência, trabalho e uma garantia reconhecida.',socialStructure:'A família governante é resultado de séculos de mistura dos três clãs fundadores. A unidade pública da Mesa é tratada como fundamento da estabilidade.',contradiction:'Proteção e crédito reduzem riscos reais, mas podem transformar acolhimento em obrigação e dependência em domínio sem necessidade de conquista aberta.',tournament:'Rhevara Mardrar, antiga Tomadora das Casas de Garantia, representa a Dinastia.'},themes:['crédito','dívida','garantia','poder econômico'],sources:['Dinastia Mardrar — documento oficial']}
            ];
            const items=dynasties.map(item=>{const slug=C.stableSlug(item.slug,item.name);return{...item,id:C.stableId(item.id,'dynasty',item.name,BOOK_ID),slug,route:`dynasty/${slug}`,sourceRef:item};});
            D.dynasties=items;
            C.setCollection(BOOK_ID,'dynasties',items);
          })();
          '''
          (data/'dynasties.js').write_text(dynasties,encoding='utf-8')

          # Atualiza personagens que ficaram defasados pelos capítulos 6 e 7 e adiciona Caeren/Alveris.
          cp=data/'characters.js'
          text=cp.read_text(encoding='utf-8')
          replacements={
            "appearanceChapters:[chId(1),chId(2),chId(3)],\n      knowledge:{knows:['É irmã de criação de Kalan e mora com Tair, Orel e Karesis em Maruva','Viu Vetarius Polar anunciar pessoalmente o Primeiro Torneio Decenal']":"appearanceChapters:[chId(1),chId(2),chId(3),chId(6)],\n      knowledge:{knows:['É irmã de criação de Kalan e mora com Tair, Orel e Karesis em Maruva','Viu Vetarius Polar anunciar pessoalmente o Primeiro Torneio Decenal','Ouviu de Karesis a história dos Meninos do Vento depois do retorno dele a Maruva no Capítulo 6']",
            "destiny:{written:'Em aberto até o Capítulo 5 — segue morando em Maruva.'":"destiny:{written:'Até o Capítulo 6, segue em Maruva e volta a conviver com Karesis depois de uma ausência que abalou a casa.'",
            "sources:['Dinastia Polar — Capítulos 1, 2 e 3']},\n    {id:'jesed-character-kalan'":"sources:['Dinastia Polar — Capítulos 1, 2, 3 e 6']},\n    {id:'jesed-character-kalan'",
            "appearanceChapters:[chId(2),chId(3)],\n      knowledge:{knows:['Darven e os demais garotos que agrediram Orel são Polar, não Nular como Tair disse aos guardas (Capítulo 3)','Alveris defende, em reunião fechada com Filhos da Raiz, que o Torneio Decenal é a melhor chance de \"libertar o povo sem destruir a cidade\" (Capítulo 3)'],suspects:[],falseBeliefs:[],unknown:['O paradeiro de Karesis']":"appearanceChapters:[chId(2),chId(3),chId(6)],\n      knowledge:{knows:['Darven e os demais garotos que agrediram Orel são Polar, não Nular como Tair disse aos guardas (Capítulo 3)','Alveris defende, em reunião fechada com Filhos da Raiz, que o Torneio Decenal é a melhor chance de \"libertar o povo sem destruir a cidade\" (Capítulo 3)','Karesis retornou à casa no Capítulo 6 depois de dias ausente, ferido e alcoolizado'],suspects:[],falseBeliefs:[],unknown:[]",
            "destiny:{written:'Em aberto até o Capítulo 5 — trabalha turnos extras na Balança Azul por causa do torneio.'":"destiny:{written:'No Capítulo 6, trabalha turnos extras na Balança Azul e confronta Karesis por abandonar a responsabilidade da casa.'",
            "sources:['Dinastia Polar — Capítulos 2 e 3']},\n    {id:'jesed-character-tair'":"sources:['Dinastia Polar — Capítulos 2, 3 e 6']},\n    {id:'jesed-character-tair'",
            "appearanceChapters:[chId(1),chId(2),chId(3)],\n      knowledge:{knows:[],suspects:[],falseBeliefs:[],unknown:[],secrets:[]},\n      destiny:{written:'Em recuperação sob os cuidados de Vesna ao fim do Capítulo 2; ainda ferido no Capítulo 3.'":"appearanceChapters:[chId(1),chId(2),chId(3),chId(6)],\n      knowledge:{knows:[],suspects:[],falseBeliefs:[],unknown:[],secrets:[]},\n      destiny:{written:'Permanece integrado à casa de Maruva; no Capítulo 6 ajuda a despertar Kalan quando Karesis retorna.'",
            "sources:['Dinastia Polar — Capítulos 1, 2 e 3']},\n    {id:'jesed-character-karesis'":"sources:['Dinastia Polar — Capítulos 1, 2, 3 e 6']},\n    {id:'jesed-character-karesis'"
          }
          for old,new in replacements.items():
              if old not in text: raise RuntimeError('Trecho esperado não encontrado em characters.js: '+old[:80])
              text=text.replace(old,new,1)

          def replace_between(txt,start_id,next_id,new_block):
              pattern=re.compile(r"    \{id:'"+re.escape(start_id)+r"'.*?(?=    \{id:'"+re.escape(next_id)+r"')",re.S)
              txt2,n=pattern.subn(new_block,txt,count=1)
              if n!=1: raise RuntimeError(f'Não foi possível substituir {start_id}: {n}')
              return txt2

          karesis="""    {id:'jesed-character-karesis',slug:'karesis',name:'Karesis',shortName:'Karesis',alias:'Responsável legal da casa coletiva de Maruva',status:'Vivo',importance:'Secundário',image:IMG+'karesis.webp',
      summary:'Responsável legal pela casa coletiva de Maruva. Depois de permanecer ausente por dias, retorna no Capítulo 6 magro, ferido, vestido como pescador e cheirando a bebida. Kalan o confronta por abandonar as obrigações da casa; Karesis quase não se defende. Mais tarde, oferece a Elis uma nova história e narra os “Meninos do Vento”, versão oral e deformada de um passado que o leitor dos livros anteriores reconhece em Etérea.',
      personality:['Evasivo','Enigmático','Irregular','Contador de histórias'],voice:'Fala pouco e raramente se justifica; ao contar histórias, abandona por instantes a secura habitual.',
      appearanceChapters:[chId(6)],
      knowledge:{knows:['Histórias antigas transmitidas oralmente, entre elas a dos Meninos do Vento'],suspects:[],falseBeliefs:[],unknown:[],secrets:['O manuscrito ainda não explica onde esteve durante a ausência nem a origem precisa de suas histórias']},
      destiny:{written:'Retorna a Maruva no Capítulo 6, enfrenta a ruptura com Kalan e conta a Elis a história dos Meninos do Vento.',planned:NOTE,state:'Em desenvolvimento'},
      sources:['Dinastia Polar — Capítulos 2 e 3 (mencionado) e Capítulo 6']},
"""
          text=replace_between(text,'jesed-character-karesis','jesed-character-selina',karesis)

          vetarius="""    {id:'jesed-character-vetarius-polar',slug:'vetarius-polar',name:'Vetarius Polar',shortName:'Vetarius',alias:'Soberano de Kaeliran · 48 ciclos',status:'Vivo',importance:'Protagonista/Antagonista',image:IMG+'vetarius-polar.webp',dynastyId:'jesed-dynasty-polar',
      summary:'Soberano da Dinastia Polar. Anuncia o Primeiro Torneio Decenal e decide sozinho convocar Dareth como campeão, registrando o nome antes de obter consentimento. No Capítulo 7 reencontra Dareth depois de vinte anos e revela que Elena, sua companheira, morreu há cinco anos; desde então criou o filho Caeren sem ela. O reencontro mostra o afeto real entre os dois homens e também a tendência de Vetarius de transformar amizade e memória em argumento político.',
      personality:['Carismático','Confiante','Impulsivo','Decidido a impor a própria vontade'],voice:'Discurso público cadenciado e persuasivo; em privado, mais cru, íntimo e impaciente.',
      appearanceChapters:[chId(1),chId(4),chId(7)],
      knowledge:{knows:['Dareth retornou a Kaeliran depois de vinte anos (Capítulo 7)','Caeren é forte e inteligente, mas difícil de conduzir para a política segundo sua própria avaliação'],suspects:[],falseBeliefs:[],unknown:[],secrets:[]},
      destiny:{written:'No Capítulo 7, recebe Dareth em Kaendar e tenta convencê-lo de que representar os Polar no torneio é necessário para impedir novas guerras.',planned:NOTE,state:'Em desenvolvimento'},
      sources:['Dinastia Polar — Capítulos 1, 4 e 7']},
"""
          text=replace_between(text,'jesed-character-vetarius-polar','jesed-character-sumo-vigia',vetarius)

          dareth="""    {id:'jesed-character-dareth-quatro-dedos',slug:'dareth-quatro-dedos',name:'Dareth',shortName:'Dareth',alias:'“Quatro-Dedos” · veterano Polar aposentado · cerca de 48 ciclos',status:'Vivo',importance:'Protagonista',image:IMG+'dareth-quatro-dedos.webp',dynastyId:'jesed-dynasty-polar',
      summary:'Antigo Segundo Kae e ex-Calandrir, conhecido como “Quatro-Dedos” desde que perdeu um dedo defendendo uma passagem e salvando Vetarius e outros feridos. Viveu vinte anos afastado de Kaeliran numa propriedade marcada pelos vestígios de uma família perdida. No Capítulo 5 recusa a convocação de Selina; no Capítulo 7 retorna à cidade, é reconhecido por guardas e velhos companheiros e reencontra Vetarius em Kaendar.',
      personality:['Reservado','Ferido pelo próprio passado','Íntegro','Observador'],voice:'Seca, econômica; demora antes de responder e não tolera que transformem sua dor em cerimônia.',

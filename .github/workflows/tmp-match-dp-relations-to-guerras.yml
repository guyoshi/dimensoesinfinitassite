name: Match Dinastia Polar Relations to Guerras
on:
  push:
    paths:
      - '.github/workflows/tmp-match-dp-relations-to-guerras.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace relationship renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/sagas/ciclo-de-jesed/books/dinastia-polar/app.js')
          s=p.read_text(encoding='utf-8')
          a=s.index('function renderRelationships()')
          b=s.index('  function renderFamilies()',a)
          new=Path('.tmp_dp_rel_renderer.txt').read_text(encoding='utf-8')
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
          h=Path('dinastia-polar.html')
          hs=h.read_text(encoding='utf-8').replace('20260914a','20260914b')
          h.write_text(hs,encoding='utf-8')
          PY
          node --check app/sagas/ciclo-de-jesed/books/dinastia-polar/app.js
          node --check data/sagas/ciclo-de-jesed/books/dinastia-polar/relationships.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/sagas/ciclo-de-jesed/books/dinastia-polar/app.js dinastia-polar.html
          git commit -m 'Match Dinastia Polar relationships page to Guerras de Sangue'
          git pull --rebase origin main
          git push origin main
